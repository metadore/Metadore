<svg width="1200" height="650" viewBox="0 0 1200 650"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="treeGradient" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#36BCF7"/>
<stop offset="100%" stop-color="#00FF9C"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="5" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<filter id="strongGlow">
<feGaussianBlur stdDeviation="12"/>
</filter>

</defs>

<!-- BACKGROUND -->

<rect width="1200" height="650"
rx="25"
fill="#050b12"
stroke="#203a43"
stroke-width="2"/>

<!-- GRID -->

<g opacity="0.07" stroke="#36BCF7">

<line x1="0" y1="100" x2="1200" y2="100"/>
<line x1="0" y1="200" x2="1200" y2="200"/>
<line x1="0" y1="300" x2="1200" y2="300"/>
<line x1="0" y1="400" x2="1200" y2="400"/>
<line x1="0" y1="500" x2="1200" y2="500"/>

<line x1="100" y1="0" x2="100" y2="650"/>
<line x1="300" y1="0" x2="300" y2="650"/>
<line x1="500" y1="0" x2="500" y2="650"/>
<line x1="700" y1="0" x2="700" y2="650"/>
<line x1="900" y1="0" x2="900" y2="650"/>
<line x1="1100" y1="0" x2="1100" y2="650"/>

</g>

<!-- PARTICLES -->

<g fill="#36BCF7">

<circle cx="100" cy="120" r="2">
<animate attributeName="opacity"
values="0.2;1;0.2"
dur="2s"
repeatCount="indefinite"/>
</circle>

<circle cx="1080" cy="150" r="2">
<animate attributeName="opacity"
values="1;0.2;1"
dur="3s"
repeatCount="indefinite"/>
</circle>

<circle cx="920" cy="500" r="2">
<animate attributeName="opacity"
values="0.2;1;0.2"
dur="2.5s"
repeatCount="indefinite"/>
</circle>

<circle cx="150" cy="500" r="2">
<animate attributeName="opacity"
values="1;0.2;1"
dur="4s"
repeatCount="indefinite"/>
</circle>

<circle cx="250" cy="80" r="2">
<animate attributeName="opacity"
values="0.2;1;0.2"
dur="3.5s"
repeatCount="indefinite"/>
</circle>

<circle cx="1000" cy="400" r="2">
<animate attributeName="opacity"
values="1;0.2;1"
dur="2.7s"
repeatCount="indefinite"/>
</circle>

</g>

<!-- TITLE -->

<text x="600"
y="55"
text-anchor="middle"
fill="white"
font-family="monospace"
font-size="28"
font-weight="bold">

METADORE // SKILL TREE

</text>

<text x="600"
y="78"
text-anchor="middle"
fill="#36BCF7"
font-family="monospace"
font-size="11">

ROOT SYSTEM // ONLINE

</text>

<!-- MAIN TREE GLOW -->

<path d="M600 560
C600 470 600 390 600 300
C600 220 600 160 600 105"
stroke="#36BCF7"
stroke-width="18"
opacity="0.08"
fill="none"
filter="url(#strongGlow)"/>

<!-- TREE -->

<g fill="none"
stroke="url(#treeGradient)"
stroke-width="8"
stroke-linecap="round"
filter="url(#glow)">

<!-- TRUNK -->

<path d="M600 560
C600 470 600 390 600 300
C600 220 600 160 600 105"
stroke-dasharray="600"
stroke-dashoffset="600">

<animate
attributeName="stroke-dashoffset"
from="600"
to="0"
dur="3s"
fill="freeze"/>

</path>

<!-- TECHNOLOGY -->

<path d="M600 330
C520 315 430 260 330 210"/>

<!-- SCIENCE -->

<path d="M600 360
C680 340 780 275 870 215"/>

<!-- ART -->

<path d="M600 270
C520 210 450 160 380 120"/>

<!-- WEB -->

<path d="M600 250
C690 190 770 150 840 120"/>

</g>

<!-- ROOTS -->

<g fill="none"
stroke="#00FF9C"
stroke-width="4"
opacity="0.7">

<path d="M600 560 C520 590 450 610 370 620"/>
<path d="M600 560 C680 590 750 610 830 620"/>
<path d="M600 560 C560 600 530 620 500 630"/>
<path d="M600 560 C640 600 670 620 700 630"/>

</g>

<!-- ROOT NODE -->

<circle cx="600"
cy="105"
r="45"
fill="#07111a"
stroke="#36BCF7"
stroke-width="4"
filter="url(#glow)">

<animate
attributeName="r"
values="45;50;45"
dur="2s"
repeatCount="indefinite"/>

</circle>

<text x="600"
y="102"
text-anchor="middle"
fill="white"
font-family="monospace"
font-size="17"
font-weight="bold">

METADORE

</text>

<text x="600"
y="122"
text-anchor="middle"
fill="#36BCF7"
font-family="monospace"
font-size="10">

ROOT NODE

</text>

<!-- TECH NODE -->

<circle cx="330"
cy="210"
r="43"
fill="#07111a"
stroke="#36BCF7"
stroke-width="3"
filter="url(#glow)">

<animate
attributeName="stroke-width"
values="3;5;3"
dur="2s"
repeatCount="indefinite"/>

</circle>

<text x="330"
y="207"
text-anchor="middle"
fill="white"
font-family="monospace"
font-size="14"
font-weight="bold">

TECH

</text>

<text x="330"
y="224"
text-anchor="middle"
fill="#36BCF7"
font-family="monospace"
font-size="9">

ACTIVE

</text>

<!-- SCIENCE NODE -->

<circle cx="870"
cy="215"
r="43"
fill="#07111a"
stroke="#00FF9C"
stroke-width="3"
filter="url(#glow)">

<animate
attributeName="stroke-width"
values="3;5;3"
dur="2.5s"
repeatCount="indefinite"/>

</circle>

<text x="870"
y="212"
text-anchor="middle"
fill="white"
font-family="monospace"
font-size="14"
font-weight="bold">

SCIENCE

</text>

<text x="870"
y="229"
text-anchor="middle"
fill="#00FF9C"
font-family="monospace"
font-size="9">

EXPLORING

</text>

<!-- ART NODE -->

<circle cx="380"
cy="120"
r="36"
fill="#07111a"
stroke="#ff66cc"
stroke-width="3"
filter="url(#glow)"/>

<text x="380"
y="117"
text-anchor="middle"
fill="white"
font-family="monospace"
font-size="13"
font-weight="bold">

ART

</text>

<text x="380"
y="133"
text-anchor="middle"
fill="#ff66cc"
font-family="monospace"
font-size="9">

CREATIVE

</text>

<!-- WEB NODE -->

<circle cx="840"
cy="120"
r="36"
fill="#07111a"
stroke="#b56cff"
stroke-width="3"
filter="url(#glow)"/>

<text x="840"
y="117"
text-anchor="middle"
fill="white"
font-family="monospace"
font-size="13"
font-weight="bold">

WEB

</text>

<text x="840"
y="133"
text-anchor="middle"
fill="#b56cff"
font-family="monospace"
font-size="9">

BUILDING

</text>

<!-- LOWER SKILLS -->

<g font-family="monospace"
font-size="14"
fill="#d7f9ff">

<text x="235" y="330">
AI / ML
</text>

<text x="420" y="355">
TOOLS
</text>

<text x="735" y="360">
RESEARCH
</text>

<text x="910" y="335">
DATA
</text>

</g>

<!-- STATUS -->

<text x="600"
y="590"
text-anchor="middle"
fill="#36BCF7"
font-family="monospace"
font-size="14">

SYSTEM STATUS : TREE GROWING...

</text>

<!-- SCANNING LINE -->

<rect x="100"
y="85"
width="1000"
height="2"
fill="#36BCF7"
opacity="0.25">

<animate
attributeName="y"
values="85;570;85"
dur="5s"
repeatCount="indefinite"/>

</rect>

</svg>
