<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Welcome to Metadore: a digital playground for AI, neuroscience, hardware and creative code."><defs><filter id="gl" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="gl2" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#12002b"/><stop offset="1" stop-color="#2a0a4a"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff2e93"/><stop offset="1" stop-color="#ff8a00"/></linearGradient></defs>
<rect width="1200" height="400" rx="12" fill="url(#bg)" stroke="#7a2cff" stroke-width="1.5"/><rect width="10" height="400" rx="4" fill="url(#ac)"/><text x="52" y="62" font-family="'Trebuchet MS', 'Segoe UI', Verdana, Arial, sans-serif" font-size="22" fill="#ffe8f5">Welcome to <tspan fill="#ff2e93" font-weight="bold">METADORE</tspan> — a digital playground inspired by curiosity, experimentation,</text><text x="52" y="94" font-family="'Trebuchet MS', 'Segoe UI', Verdana, Arial, sans-serif" font-size="22" fill="#ffe8f5">and the desire to build things that <tspan fill="#ff8a00" font-weight="bold">probably shouldn’t exist</tspan>.</text><text x="52" y="126" font-family="'Trebuchet MS', 'Segoe UI', Verdana, Arial, sans-serif" font-size="22" fill="#ffe8f5"></text><text x="52" y="148" font-family="'Trebuchet MS', 'Segoe UI', Verdana, Arial, sans-serif" font-size="22" fill="#ffe8f5">I explore <tspan fill="#00e5c7" font-weight="bold">artificial intelligence</tspan>, <tspan fill="#00e5c7" font-weight="bold">computational neuroscience</tspan>, <tspan fill="#00e5c7" font-weight="bold">experimental hardware</tspan>,</text><text x="52" y="180" font-family="'Trebuchet MS', 'Segoe UI', Verdana, Arial, sans-serif" font-size="22" fill="#ffe8f5"><tspan fill="#00e5c7" font-weight="bold">creative coding</tspan>, and <tspan fill="#00e5c7" font-weight="bold">unconventional web experiences</tspan>.</text><text x="52" y="212" font-family="'Trebuchet MS', 'Segoe UI', Verdana, Arial, sans-serif" font-size="22" fill="#ffe8f5"></text><text x="52" y="234" font-family="'Trebuchet MS', 'Segoe UI', Verdana, Arial, sans-serif" font-size="22" fill="#ffe8f5">I build things, break things, investigate why they broke, and occasionally</text><text x="52" y="266" font-family="'Trebuchet MS', 'Segoe UI', Verdana, Arial, sans-serif" font-size="22" fill="#ffe8f5">turn the results into something <tspan fill="#ffc93c" font-weight="bold">interesting</tspan>.</text><line x1="52" x2="1148" y1="302" y2="302" stroke="#ff2e93" stroke-opacity=".5" stroke-dasharray="6 8"/>
<text x="600" y="350" text-anchor="middle" font-family="Impact, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-style="italic" font-size="34" letter-spacing="4" fill="#00e5c7" filter="url(#gl)">THE CITY NEVER SLEEPS. NEITHER DOES THE TERMINAL.</text></svg>