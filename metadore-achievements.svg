<svg width="1200" height="500"
viewBox="0 0 1200 500"
xmlns="http://www.w3.org/2000/svg">

<defs>

<filter id="glow">
<feGaussianBlur stdDeviation="4" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

</defs>

<!-- BACKGROUND -->

<rect width="1200"
height="500"
rx="25"
fill="#050b12"
stroke="#203a43"
stroke-width="2"/>

<!-- TITLE -->

<text x="600"
y="55"
text-anchor="middle"
fill="white"
font-family="monospace"
font-size="28"
font-weight="bold">

METADORE // ACHIEVEMENTS

</text>

<text x="600"
y="80"
text-anchor="middle"
fill="#36BCF7"
font-family="monospace"
font-size="11">

ACHIEVEMENT DATABASE // ONLINE

</text>

<!-- ACHIEVEMENT 1 -->

<circle cx="180"
cy="200"
r="65"
fill="#07111a"
stroke="#36BCF7"
stroke-width="4"
filter="url(#glow)">

<animate
attributeName="r"
values="65;70;65"
dur="2s"
repeatCount="indefinite"/>

</circle>

<text x="180"
y="205"
text-anchor="middle"
font-size="34">

🏆

</text>

<text x="180"
y="300"
text-anchor="middle"
fill="white"
font-family="monospace"
font-size="14">

FIRST BUILD

</text>

<text x="180"
y="325"
text-anchor="middle"
fill="#7d8c99"
font-family="monospace"
font-size="10">

Turning ideas into projects

</text>

<!-- ACHIEVEMENT 2 -->

<circle cx="420"
cy="200"
r="65"
fill="#07111a"
stroke="#00FF9C"
stroke-width="4"
filter="url(#glow)">

<animate
attributeName="stroke-width"
values="4;6;4"
dur="2.4s"
repeatCount="indefinite"/>

</circle>

<text x="420"
y="205"
text-anchor="middle"
font-size="34">

🔬

</text>

<text x="420"
y="300"
text-anchor="middle"
fill="white"
font-family="monospace"
font-size="14">

SCIENCE EXPLORER

</text>

<text x="420"
y="325"
text-anchor="middle"
fill="#7d8c99"
font-family="monospace"
font-size="10">

Science + technology

</text>

<!-- ACHIEVEMENT 3 -->

<circle cx="660"
cy="200"
r="65"
fill="#07111a"
stroke="#b56cff"
stroke-width="4"
filter="url(#glow)">

<animate
attributeName="r"
values="65;70;65"
dur="2.8s"
repeatCount="indefinite"/>

</circle>

<text x="660"
y="205"
text-anchor="middle"
font-size="34">

🤖

</text>

<text x="660"
y="300"
text-anchor="middle"
fill="white"
font-family="monospace"
font-size="14">

AI EXPLORER

</text>

<text x="660"
y="325"
text-anchor="middle"
fill="#7d8c99"
font-family="monospace"
font-size="10">

Exploring intelligent systems

</text>

<!-- ACHIEVEMENT 4 -->

<circle cx="900"
cy="200"
r="65"
fill="#07111a"
stroke="#ff66cc"
stroke-width="4"
filter="url(#glow)">

<animate
attributeName="stroke-width"
values="4;6;4"
dur="3s"
repeatCount="indefinite"/>

</circle>

<text x="900"
y="205"
text-anchor="middle"
font-size="34">

🎨

</text>

<text x="900"
y="300"
text-anchor="middle"
fill="white"
font-family="monospace"
font-size="14">

CREATIVE ENGINEER

</text>

<text x="900"
y="325"
text-anchor="middle"
fill="#7d8c99"
font-family="monospace"
font-size="10">

Design + technology

</text>

<!-- PROGRESS -->

<text x="600"
y="390"
text-anchor="middle"
fill="#36BCF7"
font-family="monospace"
font-size="13">

ACHIEVEMENT PROGRESS

</text>

<rect x="300"
y="420"
width="600"
height="8"
rx="4"
fill="#17232d"/>

<rect x="300"
y="420"
width="360"
height="8"
rx="4"
fill="#36BCF7"
filter="url(#glow)">

<animate
attributeName="width"
values="300;360;300"
dur="3s"
repeatCount="indefinite"/>

</rect>

</svg>
