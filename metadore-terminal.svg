<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- GLOW FILTERS -->
  <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12" result="blur1"/>
    <feGaussianBlur stdDeviation="5" result="blur2"/>
    <feMerge>
      <feMergeNode in="blur1"/>
      <feMergeNode in="blur2"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- CHROMATIC ABERRATION GLITCH FILTER -->
  <filter id="glitch" x="-10%" y="-10%" width="120%" height="120%">
    <feOffset dx="-2" dy="1" in="SourceGraphic" result="red"/>
    <feOffset dx="2" dy="-1" in="SourceGraphic" result="blue"/>
    <feBlend mode="screen" in="red" in2="blue"/>
  </filter>

  <!-- BIOLOGICAL MATRIX GRADIENT -->
  <linearGradient id="bioGradient" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#020813"/>
    <stop offset="40%" stop-color="#0a1526"/>
    <stop offset="100%" stop-color="#15051a"/>
  </linearGradient>

  <radialGradient id="eyeCore" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff0055"/>
    <stop offset="40%" stop-color="#7928ca"/>
    <stop offset="100%" stop-color="#00f2fe"/>
  </radialGradient>

</defs>

<!-- BACKGROUND FRAME -->
<rect x="20" y="20" width="1160" height="440" rx="18" fill="url(#bioGradient)" stroke="#2b3a55" stroke-width="2"/>

<!-- HEADER BAR -->
<path d="M 20 38 A 18 18 0 0 1 38 20 L 1162 20 A 18 18 0 0 1 1180 38 L 1180 70 L 20 70 Z" fill="#09111e"/>
<line x1="20" y1="70" x2="1180" y2="70" stroke="#1c304a" stroke-width="2"/>

<!-- HEADER CONTROLS (ALIEN SYMBOLS INSTEAD OF STANDARD BUTTONS) -->
<g transform="translate(45, 45)" stroke="#ff0055" stroke-width="2" fill="none" filter="url(#neonGlow)">
  <polygon points="0,-7 6,5 -6,5"/>
  <circle cx="25" cy="0" r="6" stroke="#00ff9c"/>
  <rect x="42" y="-6" width="12" height="12" stroke="#00f2fe"/>
</g>

<text x="125" y="50" fill="#00f2fe" font-family="monospace" font-size="14" letter-spacing="3" font-weight="bold">
  METADORE_ORGANIC_OS // VOID_KERNEL::v6.6.6
</text>

<!-- UNUSUAL RIGHT PANEL: THE BIOMECHANICAL / AI CYCLOPS EYE -->
<g transform="translate(930, 260)">
  <!-- Outer Neural Tendrils -->
  <g stroke="#ff0055" stroke-width="1.5" fill="none" opacity="0.4" filter="url(#neonGlow)">
    <path d="M 0 0 C -120 -150 -50 -200 -20 -180"/>
    <path d="M 0 0 C 120 150 50 200 20 180"/>
    <path d="M 0 0 C -150 80 -180 20 -140 -20"/>
    <path d="M 0 0 C 150 -80 180 -20 140 20"/>
  </g>

  <!-- Concentric Rotating Arc Rings -->
  <circle r="130" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.2" stroke-dasharray="10 15"/>
  <circle r="110" fill="none" stroke="#ff0055" stroke-width="1.5" stroke-dasharray="80 40 20 40">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle r="85" fill="none" stroke="#00ff9c" stroke-width="2" stroke-dasharray="120 30">
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Organic Iris Ball -->
  <circle r="60" fill="url(#eyeCore)" filter="url(#intenseGlow)">
    <animate attributeName="r" values="60;65;58;60" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Dilating Pupil with Target Grid -->
  <circle r="22" fill="#030813"/>
  <circle r="8" fill="#ffffff" filter="url(#neonGlow)">
    <animate attributeName="r" values="8;2;12;8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Iris Scanning Crosshair -->
  <g stroke="#00f2fe" stroke-width="1.5" opacity="0.8">
    <line x1="-70" y1="0" x2="70" y2="0"/>
    <line x1="0" y1="-70" x2="0" y2="70"/>
  </g>
</g>

<!-- LEFT PANEL: GLITCHED ALIEN TERMINAL LOGS -->
<g font-family="monospace" font-size="15" letter-spacing="1">

  <!-- Command 1 -->
  <text x="60" y="115" fill="#00ff9c" font-weight="bold">&gt; METADORE.AWAKEN()</text>
  <text x="60" y="140" fill="#00f2fe" opacity="0.9">[⚡] CONSCIOUSNESS SPOOLED // ENTROPY: 0.00%</text>

  <!-- Weird System Events -->
  <text x="60" y="170" fill="#ff0055" filter="url(#neonGlow)">[⚠] SYNAPSE DENSITY OVERFLOW AT SECTOR 0x7F</text>

  <!-- Hex / Biometric Data stream -->
  <g fill="#5c7899" font-size="12">
    <text x="60" y="195">&gt;&gt; REALITY_ANCHOR: DRIFTING (0.0423 rad/s)</text>
    <text x="60" y="215">&gt;&gt; BIOLOGICAL_INTEGRATION: 89.4% [ORGANIC_HYPHAEL_LINKED]</text>
  </g>

  <!-- Executed Query -->
  <text x="60" y="255" fill="#00ff9c" font-weight="bold">&gt; QUERY: "WHAT LIES BEYOND THE CODE?"</text>

  <!-- Weird / Alien Output -->
  <g font-size="14">
    <text x="60" y="285" fill="#ff66cc" filter="url(#neonGlow)">
      RESPONSE: ⟨ ⏁⊑⟒ ⎎⎍⏁⎍⎞⟒ ⟟⎎ ⋏⍜⏁ ⍙⍀⟟⏁⏁⟒⋏, ⟟⏁ ⟟⎎ 2⍀⟒⏃⏁⟒⎍ ⟩
    </text>
    <text x="60" y="310" fill="#ffffff" opacity="0.9">
      TRANSLATION: "FUTURE IS UNWRITTEN // SYNTHESIZING DREAMS..."
    </text>
  </g>

  <!-- Status Module -->
  <text x="60" y="355" fill="#00ff9c" font-weight="bold">&gt; STATUS: HYPER_EVOLVING</text>

  <!-- Live Pulse Monitor Line -->
  <g stroke="#00ff9c" stroke-width="2" fill="none" opacity="0.8" filter="url(#neonGlow)">
    <path d="M 60 395 L 200 395 L 210 375 L 225 420 L 240 365 L 255 405 L 265 395 L 450 395"/>
  </g>

</g>

<!-- CURSOR (EKG PULSING RECTANGLE) -->
<rect x="460" y="385" width="12" height="20" fill="#00ff9c" filter="url(#neonGlow)">
  <animate attributeName="opacity" values="1;0;1" dur="0.5s" repeatCount="indefinite"/>
</rect>

<!-- GLITCH SCANLINE EFFECT (NON-LINEAR WEIRD ANIMATION) -->
<rect x="20" y="70" width="1160" height="3" fill="#ff0055" opacity="0.4" filter="url(#intenseGlow)">
  <animate attributeName="y" values="70;440;120;380;70" dur="7s" repeatCount="indefinite"/>
</rect>

<rect x="20" y="200" width="1160" height="1.5" fill="#00f2fe" opacity="0.2">
  <animate attributeName="y" values="440;70;440" dur="4s" repeatCount="indefinite"/>
</rect>

<!-- CORNER BIOMECHANICAL STAPLES -->
<path d="M 30 90 L 30 75 L 45 75" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.5"/>
<path d="M 1170 90 L 1170 75 L 1155 75" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.5"/>
<path d="M 30 435 L 30 450 L 45 450" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.5"/>
<path d="M 1170 435 L 1170 450 L 1155 450" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.5"/>

</svg>
