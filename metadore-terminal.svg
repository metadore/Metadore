<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- SPOOKY GLOW FILTERS -->
  <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="12" result="blur1"/>
    <feGaussianBlur stdDeviation="5" result="blur2"/>
    <feMerge>
      <feMergeNode in="blur1"/>
      <feMergeNode in="blur2"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- HAUNTED MATRIX GRADIENTS -->
  <linearGradient id="bioGradient" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#01040a"/>
    <stop offset="50%" stop-color="#051206"/>
    <stop offset="100%" stop-color="#110214"/>
  </linearGradient>

  <radialGradient id="eggGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#a3ff00"/>
    <stop offset="60%" stop-color="#39ff14"/>
    <stop offset="100%" stop-color="#021401"/>
  </radialGradient>

  <radialGradient id="voidCore" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff0055"/>
    <stop offset="40%" stop-color="#0d0012"/>
    <stop offset="100%" stop-color="#000000"/>
  </radialGradient>

  <!-- SPIDER LEGS DEF -->
  <g id="spiderLegs" stroke="#1d2d1f" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- Left Legs -->
    <path d="M -10 -5 C -25 -20, -35 -20, -45 -10"/>
    <path d="M -12 0 C -30 -10, -42 -5, -50 8"/>
    <path d="M -12 5 C -30 10, -42 18, -48 30"/>
    <path d="M -10 10 C -25 25, -35 35, -40 45"/>
    <!-- Right Legs -->
    <path d="M 10 -5 C 25 -20, 35 -20, 45 -10"/>
    <path d="M 12 0 C 30 -10, 42 -5, 50 8"/>
    <path d="M 12 5 C 30 10, 42 18, 48 30"/>
    <path d="M 10 10 C 25 25, 35 35, 40 45"/>
  </g>
</defs>

<!-- BACKGROUND FRAME -->
<rect x="20" y="20" width="1160" height="480" rx="18" fill="url(#bioGradient)" stroke="#1a381e" stroke-width="3"/>

<!-- HAUNTED BACKGROUND GRID (WEBBED/CRACKED LOOK) -->
<g opacity="0.1" stroke="#39ff14" stroke-width="1" stroke-dasharray="8 4">
  <line x1="20" y1="120" x2="1180" y2="120"/>
  <line x1="20" y1="220" x2="1180" y2="220"/>
  <line x1="20" y1="320" x2="1180" y2="320"/>
  <line x1="20" y1="420" x2="1180" y2="420"/>
  <line x1="200" y1="70" x2="200" y2="500"/>
  <line x1="400" y1="70" x2="400" y2="500"/>
  <line x1="600" y1="70" x2="600" y2="500"/>
  <line x1="800" y1="70" x2="800" y2="500"/>
  <line x1="1000" y1="70" x2="1000" y2="500"/>
</g>

<!-- AMBIENT PARTICLES (TOXIC FUMES) -->
<g fill="#39ff14">
  <circle cx="120" cy="140" r="2.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="1060" cy="130" r="2.5"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="940" cy="480" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="280" cy="90" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
  <circle cx="580" cy="220" r="1.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.8s" repeatCount="indefinite"/></circle>
</g>

<!-- HEADER BAR -->
<path d="M 20 38 A 18 18 0 0 1 38 20 L 1162 20 A 18 18 0 0 1 1180 38 L 1180 70 L 20 70 Z" fill="#040d06"/>
<line x1="20" y1="70" x2="1180" y2="70" stroke="#1f4222" stroke-width="2"/>

<!-- HEADER CONTROLS (HAUNTED SYMBOLS) -->
<g transform="translate(45, 45)" stroke="#39ff14" stroke-width="2.5" fill="none" filter="url(#neonGlow)">
  <path d="M 0 -7 L 7 5 L -7 5 Z"/>
  <circle cx="25" cy="0" r="7" stroke="#00ff9c"/>
  <rect x="42" y="-6" width="12" height="12" stroke="#ff0055"/>
</g>

<text x="135" y="50" fill="#39ff14" font-family="monospace" font-size="15" letter-spacing="4" font-weight="bold" filter="url(#neonGlow)">
  METADORE_HAUNTED_OS // NEURAL_INFESTATION::v8.6.6
</text>

<text x="1150" y="50" text-anchor="end" fill="#ff0055" font-family="monospace" font-size="12" letter-spacing="2" filter="url(#neonGlow)">
  [ INFESTATION_LEVEL: 68.4% ]
</text>

<!-- LEFT PANEL: SPIDER WEB NETWORK MAP -->
<g transform="translate(70, 90)">
  <rect width="450" height="380" fill="#020803" rx="12" stroke="#1f4222" stroke-width="2"/>
  <text x="25" y="32" fill="#00ff9c" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">
    &gt; SYNAPTIC_WEB_MAP
  </text>

  <!-- Network Connections (WEB STRANDS) -->
  <g stroke="#39ff14" stroke-width="1.2" opacity="0.3" fill="none" filter="url(#neonGlow)">
    <path d="M 80 120 C 120 100, 180 100, 200 80"/>
    <path d="M 200 80 C 250 110, 300 130, 320 150"/>
    <path d="M 320 150 C 280 180, 220 200, 180 240"/>
    <path d="M 180 240 C 140 200, 100 160, 80 120"/>
    <path d="M 200 80 C 280 160, 340 220, 380 260"/>
    <path d="M 380 260 C 340 290, 320 310, 280 320"/>
    <path d="M 280 320 C 240 280, 200 260, 180 240"/>
    <path d="M 80 120 C 85 180, 90 240, 100 280"/>
    <path d="M 100 280 C 160 300, 220 315, 280 320"/>
  </g>

  <!-- Nodes -->
  <!-- Node 1 -->
  <g transform="translate(80, 120)">
    <circle r="12" fill="url(#eggsGlow)" stroke="#39ff14" stroke-width="2" filter="url(#neonGlow)">
      <animate attributeName="r" values="10;13;10" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="4" fill="#e2f7e2" font-family="monospace" font-size="10">NODE_01</text>
  </g>
  <!-- Node 2 (INFECTED) -->
  <g transform="translate(200, 80)">
    <circle r="16" fill="url(#eggGlow)" stroke="#ff0055" stroke-width="2.5" filter="url(#strongGlow)"/>
    <text x="22" y="4" fill="#ff0055" font-family="monospace" font-size="10" font-weight="bold">INFECTED_ALPHA</text>
  </g>
  <!-- Node 3 -->
  <g transform="translate(320, 150)">
    <circle r="10" fill="url(#eggsGlow)" stroke="#39ff14" stroke-width="2" filter="url(#neonGlow)"/>
  </g>
  <!-- Node 4 (CORE_HIVE) -->
  <g transform="translate(180, 240)">
    <circle r="20" fill="#01040a" stroke="#00ff9c" stroke-width="2" filter="url(#strongGlow)">
      <animate attributeName="r" values="18;23;18" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#00ff9c"/>
    <text x="26" y="4" fill="#00ff9c" font-family="monospace" font-size="11" font-weight="bold">CORE_HIVE</text>
    <use href="#spiderLegs" transform="scale(0.3)"/>
  </g>
  <!-- Node 5 -->
  <g transform="translate(380, 260)">
    <circle r="14" fill="url(#eggGlow)" stroke="#39ff14" stroke-width="2" filter="url(#neonGlow)"/>
    <text x="20" y="4" fill="#e2f7e2" font-family="monospace" font-size="10">NODE_09</text>
  </g>
  <!-- Node 6 -->
  <g transform="translate(100, 280)">
    <circle r="10" fill="url(#eggsGlow)" stroke="#39ff14" stroke-width="2" filter="url(#neonGlow)"/>
  </g>
  <!-- Node 7 -->
  <g transform="translate(280, 320)">
    <circle r="12" fill="url(#eggsGlow)" stroke="#39ff14" stroke-width="2" filter="url(#neonGlow)"/>
    <text x="18" y="4" fill="#e2f7e2" font-family="monospace" font-size="10">VOID_END</text>
  </g>

  <!-- Toxic Status Box inside left panel -->
  <rect x="25" y="320" width="220" height="40" fill="#01040a" rx="4" stroke="#1f4222"/>
  <text x="35" y="336" fill="#00ff9c" font-family="monospace" font-size="10">&gt; PULSE_FREQ: 144Hz</text>
  <text x="35" y="352" fill="#ff0055" font-family="monospace" font-size="10">&gt; VENOM_DENSITY: NOMINAL</text>
</g>

<!-- RIGHT PANEL: HIVE REACTOR / ORGANIC CORE -->
<g transform="translate(870, 280)">
  <!-- Outer Organic Cable Web -->
  <g stroke="#39ff14" stroke-width="2.5" fill="none" opacity="0.3" filter="url(#neonGlow)">
    <path d="M 0 0 C -200 -180 -100 -220 -30 -190"/>
    <path d="M 0 0 C 200 180 100 220 30 190"/>
    <path d="M 0 0 C -220 100 -200 -50 -160 -30"/>
    <path d="M 0 0 C 220 -100 200 50 160 30"/>
  </g>

  <!-- Mechanical Outer Rings -->
  <circle r="160" fill="none" stroke="#1f4222" stroke-width="5"/>
  <circle r="145" fill="none" stroke="#ff0055" stroke-width="2" stroke-dasharray="100 20 40 20" filter="url(#neonGlow)">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle r="125" fill="none" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="200 50">
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="105" fill="none" stroke="#00ff9c" stroke-width="3" stroke-dasharray="80 80">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulsing Hive Core -->
  <circle r="75" fill="url(#voidCore)" stroke="#000000" stroke-width="2" filter="url(#strongGlow)">
    <animate attributeName="r" values="70;80;65;70" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Large Spider centerpiece -->
  <g transform="scale(1.1) rotate(45)" filter="url(#strongGlow)">
    <!-- Legs -->
    <use href="#spiderLegs"/>
    <!-- Body -->
    <ellipse cx="0" cy="12" rx="14" ry="18" fill="#1d2d1f" stroke="#39ff14" stroke-width="2"/>
    <!-- Head -->
    <circle cx="0" cy="-6" r="10" fill="#0d0e12" stroke="#39ff14" stroke-width="1.5"/>
    <!-- Glowing Red Spider Eyes -->
    <circle cx="-4" cy="-8" r="2" fill="#ff0055"/>
    <circle cx="4" cy="-8" r="2" fill="#ff0055"/>
    <circle cx="-7" cy="-5" r="1.5" fill="#ff0055"/>
    <circle cx="7" cy="-5" r="1.5" fill="#ff0055"/>
  </g>
  
  <circle r="12" fill="#ffffff" filter="url(#strongGlow)" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- TOXIC SCANLINE ANIMATIONS -->
<rect x="20" y="70" width="1160" height="3" fill="#39ff14" opacity="0.3" filter="url(#strongGlow)">
  <animate attributeName="y" values="70;480;70" dur="8s" repeatCount="indefinite"/>
</rect>

<!-- HAUNTED CORNER STAPLES -->
<path d="M 30 90 L 30 75 L 45 75" stroke="#39ff14" stroke-width="2.5" fill="none" opacity="0.6"/>
<path d="M 1170 90 L 1170 75 L 1155 75" stroke="#39ff14" stroke-width="2.5" fill="none" opacity="0.6"/>
<path d="M 30 475 L 30 490 L 45 490" stroke="#39ff14" stroke-width="2.5" fill="none" opacity="0.6"/>
<path d="M 1170 475 L 1170 490 L 1155 490" stroke="#39ff14" stroke-width="2.5" fill="none" opacity="0.6"/>
</svg>
